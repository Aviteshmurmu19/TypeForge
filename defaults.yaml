# -------------------------------------------------------------------
# Pandoc Default Settings for markdown-to-pdf
# -------------------------------------------------------------------
# This file centralizes Pandoc conversion options for the pipeline.
# Do not add margins here - margins are controlled by render-pdf.js.

# General Writer Options:
standalone: true              # Create a full HTML document (with <head>, <body>), not just a fragment.
embed-resources: true         # Embed images, CSS, etc., into the HTML file to make it self-contained.

# Path Options:
resource-path:                # List of directories to search for resources like images.
  - src                       # We tell Pandoc to look inside the 'src' folder.
css: src/css/mdcss.css        # Path to the CSS file to include.

# This option is now handled by the resource-path above, so we don't need it.
# However, keeping it here for reference doesn't hurt.
# file-scope: false